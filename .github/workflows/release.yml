name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Tag must match package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke the tag the way pi installs it
        run: |
          tmp="$(mktemp -d)"
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/${{ github.repository }}" "$tmp/pkg"
          cd "$tmp/pkg"
          # Pi suppresses peer auto-install on package installs; mirror that here.
          npm install --omit=dev --omit=peer --no-audit --no-fund
          test -f dist/index.js
          node --input-type=module -e \
            "const s = await import('@cursor/sdk'); if (typeof s.Cursor !== 'function') process.exit(1)"
      - name: Create the GitHub Release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md | sed -e '1{/^$/d;}')"
          if [ -z "$notes" ]; then
            echo "no CHANGELOG.md entry for $version" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it unchanged"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag
