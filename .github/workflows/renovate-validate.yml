name: Renovate config

on:
  pull_request:
    paths: [renovate.json, .github/renovate.json]
  push:
    branches: [main]
    paths: [renovate.json, .github/renovate.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.3'
      - run: npm exec --yes --package=renovate -- renovate-config-validator renovate.json

  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: read
    env:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RENOVATE_REPOSITORIES: ${{ github.repository }}
      RENOVATE_DRY_RUN: full
      LOG_LEVEL: info
    # A "Cannot access vulnerability alerts" warning from this job is a
    # GITHUB_TOKEN limitation, not a config problem: the token cannot read
    # Dependabot alerts through the API Renovate uses. The hosted Renovate
    # app carries its own alerts permission and is unaffected.
    steps:
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.3'
      - run: npm exec --yes --package=renovate -- renovate
